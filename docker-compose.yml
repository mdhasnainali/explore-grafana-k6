# k6 runners. The default `k6` service reads TEST_TYPE from .env; the named
# services override it so a specific test can be run without editing .env.
#
#   docker compose run --rm k6      # runs whatever TEST_TYPE says
#   docker compose run --rm stress  # runs the stress test

x-k6: &k6
  image: grafana/k6:master-with-browser
  env_file: .env
  user: "${K6_UID:-1000}:${K6_GID:-1000}"
  working_dir: /scripts
  volumes:
    - ./scripts:/scripts:ro
    - ./results:/results
  command: run /scripts/main.js

services:
  k6:
    <<: *k6

  smoke:
    <<: *k6
    environment:
      TEST_TYPE: smoke

  load:
    <<: *k6
    environment:
      TEST_TYPE: load

  stress:
    <<: *k6
    environment:
      TEST_TYPE: stress

  spike:
    <<: *k6
    environment:
      TEST_TYPE: spike

  soak:
    <<: *k6
    environment:
      TEST_TYPE: soak

  arrival-rate:
    <<: *k6
    environment:
      TEST_TYPE: ramping_arrival_rate

  all:
    <<: *k6
    environment:
      TEST_TYPE: all
